# VERSION V2 — PROPOSED ADDITIVE EXTENSION
# Append approved keys or overrides here; do not silently alter V1.
# VERSION V3 — PROPOSED ADDITIVE EXTENSION
# Reserved for future approved additions.

# VERSION V2 — DOCUMENTATION CONTROL CONTRACT
# Status: Implemented | Based on: V1
# Keep configuration keys typed and validate this YAML with scripts/validate_coding_prompt_docs.py.
