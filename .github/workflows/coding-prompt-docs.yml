name: Coding Prompt System documentation validation

on:
  push:
    paths:
      - "README.md"
      - "coding-prompt-system/**"
      - "scripts/validate_coding_prompt_docs.py"
      - ".github/workflows/coding-prompt-docs.yml"
  pull_request:
    paths:
      - "README.md"
      - "coding-prompt-system/**"
      - "scripts/validate_coding_prompt_docs.py"
      - ".github/workflows/coding-prompt-docs.yml"

jobs:
  validate-docs:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"
      - name: Install YAML parser
        run: python -m pip install PyYAML
      - name: Validate documentation
        run: python scripts/validate_coding_prompt_docs.py
